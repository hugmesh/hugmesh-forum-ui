@if (announcements().length) {
  <section
    class="forum-banner"
    role="region"
    aria-label="Forum announcements"
    aria-live="polite"
    data-testid="forum-announcements"
  >
    @for (a of announcements(); track trackById($index, a)) {
      <article class="forum-banner__article" data-testid="forum-announcement">
        <div class="forum-banner__bar">
          <h2 class="forum-banner__title" data-testid="forum-announcement-title">
            {{ a.title }}
          </h2>
          @if (a.dismissible) {
            <button
              type="button"
              class="forum-banner__dismiss"
              data-testid="forum-announcement-dismiss"
              [attr.aria-label]="'Dismiss announcement: ' + a.title"
              (click)="dismiss(a)"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          }
        </div>

        <iframe
          class="forum-banner__body"
          title="Announcement content"
          loading="lazy"
          referrerpolicy="no-referrer"
          sandbox=""
          data-testid="forum-announcement-body"
          [srcdoc]="srcdoc(a)"
        ></iframe>
      </article>
    }
  </section>
}
