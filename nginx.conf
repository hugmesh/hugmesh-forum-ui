# Per-request CSP nonce source. nginx has no random-value function, so we reuse
# $request_id — a 32-hex-char token nginx generates fresh for EVERY request, so
# it is unguessable and never repeats across responses. The `map` exposes it as
# $cspnonce, which is injected into BOTH the script-src directive and every
# <script> tag of index.html (sub_filter below) so the two always agree.
#
# Placement: this file is COPYed to /etc/nginx/conf.d/default.conf (see
# Dockerfile), i.e. it is `include`d from inside the stock nginx.conf's http
# block — so a bare `map` (http-scope directive) at file top is legal here.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection, consistent with the CSP
    #     `frame-ancestors 'none'` below. The host shell pulls this remote in via
    #     <script> (native federation), NEVER via <iframe>, so denying framing of
    #     this app does not weaken federation. (This app itself EMBEDS one
    #     srcdoc iframe — see frame-src note below — which is unrelated.)
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    #
    # ── Content-Security-Policy (STRONG, nonce-based) ─────────────────────────
    # This UI renders untrusted forum-post HTML, so the CSP is the backstop to
    # the client-side DOMPurify pass (src/app/markdown.ts).
    #
    # WHY A NONCE AND NOT A BARE `script-src 'self'`: Angular native-federation
    # emits an INLINE `<script type="esms-options">` block plus a
    # `type="module-shim"` bootstrap in index.html. Under a bare `script-src
    # 'self'` that inline block is refused, es-module-shims is never configured,
    # the module-shim bundle never runs, Angular never bootstraps and the page
    # renders BLANK with no server error. The sub_filter in `location /` stamps
    # the per-response nonce onto every <script> tag, and es-module-shims 2.8.1
    # (see package.json) auto-propagates that nonce to the ES modules it injects,
    # so federation keeps working. There is deliberately NO 'unsafe-inline' /
    # 'unsafe-hashes' in script-src — a nonce makes 'unsafe-inline' inert anyway,
    # and injected inline script stays blocked.
    #
    # Directive-by-directive, tuned to what THIS app actually does (src/**):
    #   - default-src 'self'                        : same-origin default for
    #                                                  everything not listed.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : nonce'd bootstrap scripts +
    #                                                  same-origin chunks; blob:
    #                                                  covers the module URLs
    #                                                  es-module-shims mints when
    #                                                  it has to rewrite sources.
    #                                                  No workers and no wasm in
    #                                                  this app (no `new Worker`,
    #                                                  no WebAssembly/.wasm, no
    #                                                  service-worker package), so
    #                                                  NO 'wasm-unsafe-eval' and
    #                                                  no separate worker-src —
    #                                                  worker-src would fall back
    #                                                  to script-src anyway.
    #   - style-src 'self' 'unsafe-inline'          : REQUIRED — Angular injects
    #                                                  component styles as inline
    #                                                  <style> at runtime and they
    #                                                  cannot carry a nonce. Note
    #                                                  we must NOT nonce styles:
    #                                                  a nonce in style-src would
    #                                                  make 'unsafe-inline' inert
    #                                                  and kill component styles
    #                                                  (and the announcement
    #                                                  iframe's inline <style>).
    #   - img-src 'self' data: https:               : stickers/character sprites
    #                                                  are same-origin
    #                                                  /bff/user/character/**
    #                                                  (src/app/stickers.ts,
    #                                                  vn-profile.service.ts) and
    #                                                  favicon/data: assets are
    #                                                  local; https: is for the
    #                                                  admin-authored announcement
    #                                                  banner, whose srcdoc iframe
    #                                                  INHERITS this policy and may
    #                                                  reference remote images. No
    #                                                  blob: — this app never
    #                                                  createObjectURL()s an image.
    #   - font-src 'self' data:                     : self-hosted/inlined fonts
    #                                                  only; no webfont CDN is
    #                                                  referenced anywhere in src.
    #   - connect-src 'self'                        : every XHR/fetch target is a
    #                                                  same-origin relative path —
    #                                                  ApiConfiguration.rootUrl is
    #                                                  '' and the services call
    #                                                  /bff/forum/**,
    #                                                  /bff/announcements/forum,
    #                                                  /bff/user/character/**.
    #                                                  No WebSocket/EventSource in
    #                                                  this app, so no wss:.
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : deny framing OF this app
    #                                                  (mirrors X-Frame-Options).
    # NO frame-src on purpose: the only iframe this app creates is the sandboxed,
    # null-origin `srcdoc` announcements banner (forum-announcements.component),
    # and an about:srcdoc document inherits the embedder's CSP instead of being
    # matched against frame-src. Leaving frame-src to fall back to default-src
    # 'self' matches the login/admin UIs, which render the same banner. Do NOT
    # "harden" this by adding `frame-src 'none'`.
    # NO media-src: this app plays no <video>/<audio> (the VN voicebox uses
    # speechSynthesis, which CSP does not gate), so the default-src 'self'
    # fallback is correct.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html carries SEVERAL script tags (the
        #                           esms-options block, es-module-shims, the
        #                           module-shim bootstrap) — rewrite them ALL.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; the JS
        #                           bundles are left byte-for-byte untouched (they
        #                           can legitimately contain the string "<script").
        # NB: do NOT enable gzip_static / ship a precompressed index.html —
        # sub_filter cannot rewrite an already-compressed body, which would leave
        # the script tags un-nonced and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        add_header Access-Control-Allow-Origin "*" always;
        # nginx add_header inheritance: a location that declares ANY add_header
        # DISCARDS every server-scope add_header, so the full security set is
        # repeated here — this is the block that serves index.html (where XSS
        # would run), so its CSP is the one that actually matters.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # nginx add_header inheritance: this location declares its own
        # add_header, so the server-scope security headers are NOT inherited —
        # repeat them (the CSP is kept identical/nonce-based so no response from
        # this server can ever advertise the old, bootstrap-breaking
        # `script-src 'self'`).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }
}
